<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>open.gismo — Workflow Explorer</title>
</head>
<body>
<div class="topbar">
  <h1>open.gismo</h1>

  <input type="text" id="searchInput" placeholder="Search workflows…" aria-label="Search workflows" style="width:220px">
  <button id="viewToggle" class="toggle-btn" title="Toggle compact/detailed view">Compact</button>
  <div class="tab-btns" role="tablist">
    <button class="tab-btn active" role="tab" aria-selected="true" data-tab="workflows">Workflows</button>
    <button class="tab-btn" role="tab" aria-selected="false" data-tab="explorer">Data</button>
    <button class="tab-btn" role="tab" aria-selected="false" data-tab="reports">Reports</button>
    <button class="tab-btn" role="tab" aria-selected="false" data-tab="packages">Packages</button>
  </div>
</div>
<div id="workflowsTab" class="content" role="tabpanel">
  <div class="loading"><span class="spinner"></span> Loading workflows…</div>
</div>
<div id="explorerTab" class="content" style="display:none" role="tabpanel">
  <div class="loading">Loading artifacts…</div>
</div>
<div id="reportsTab" class="content" style="display:none" role="tabpanel">
  <div class="loading"><span class="spinner"></span> Loading reports…</div>
</div>
<div id="packagesTab" class="content" style="display:none" role="tabpanel">
  <div class="loading"><span class="spinner"></span> Loading packages…</div>
</div>
<div id="detailModal" class="modal-overlay" style="display:none" role="dialog" aria-modal="true" aria-label="Workflow details">
  <div class="modal-content" id="detailModalContent"></div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
