# Runs the site/ (Vite SPA) JS test suite and a production-build smoke test.
# Mirrors the local dev workflow: npm ci, npx vitest run, npm run build.
on:
  push:
    branches: [dev, "feat/**", "feature/**"]
  pull_request:
    branches: [dev]

name: site-tests

permissions: read-all

jobs:
  site-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npx vitest run

      - name: Build (smoke test)
        run: npm run build
