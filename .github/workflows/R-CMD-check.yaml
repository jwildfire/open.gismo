# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# Runs `R CMD check` on a single ubuntu runner. Suggests (including the gsm.*
# and workr packages pulled in via DESCRIPTION's Remotes field, since they are
# public GitHub packages rather than CRAN) are installed by
# setup-r-dependencies via pak. error-on is set to "error" rather than the
# r-lib default of "warning" so pre-existing NOTEs/WARNINGs in this prototype
# don't fail CI.
on:
  push:
    branches: [dev, "feat/**", "feature/**"]
  pull_request:
    branches: [dev]

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          error-on: '"error"'
          upload-snapshots: true
